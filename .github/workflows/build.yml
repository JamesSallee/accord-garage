name: Build APK

on:
  push:
    branches: [main]
  # Pull requests get a build check only; nothing is published.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log || {
            # Surface compiler errors as annotations so they show on the run page.
            grep -E "^e: |error:|What went wrong" -A3 build.log | head -80 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "accord-garage-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: accord-garage-apk
          path: accord-garage-*.apk

      - name: Publish as a release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Accord Garage 1.0.${{ github.run_number }}
          body: |
            Built from ${{ github.sha }}.
            Download the .apk below on your phone and open it to install or update.
          files: accord-garage-*.apk
          make_latest: true
